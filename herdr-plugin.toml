id = "herdr-session-title"
name = "Session Title"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Shows each agent's session title (e.g. Claude Code's conversation name) in the sidebar's Agents section."
platforms = ["macos", "linux"]

# Refresh every agent pane once the server has restored its session.
[[startup]]
command = ["sh", "bin/herdr-session-title", "sync"]

# Agents name the session after the first prompt, so re-check whenever a
# pane's agent appears or changes state.
[[events]]
on = "pane.agent_detected"
command = ["sh", "bin/herdr-session-title", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/herdr-session-title", "event"]

[[actions]]
id = "sync"
title = "Refresh agent session titles"
command = ["sh", "bin/herdr-session-title", "sync"]
